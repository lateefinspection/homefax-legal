<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeFax - Notification Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; color: #333; }
        h2 { margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; }
        input[type="tel"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-top: 15px; }
        .checkbox-group input { margin-top: 4px; }
        .disclosure { font-size: 0.85em; color: #555; line-height: 1.4; }
        a { color: #0066cc; text-decoration: none; }
        button { background: #0066cc; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>HomeFax Notifications & Settings</h2>
    <p>Manage how you receive inspection reviews, home-care reminders, and property monitoring updates.</p>
    
    <form onsubmit="return false;">
        <div class="form-group">
            <label for="phone">Mobile Phone Number</label>
            <input type="tel" id="phone" placeholder="(555) 000-0000">
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="sms-optin">
            <label for="sms-optin" class="disclosure">
                I agree to receive recurring SMS text messages from HomeFax at the mobile number provided above, including account notifications, inspection review reminders, home-care task reminders, store reminder alerts, monitoring alerts, and service-related updates. Message frequency varies. Message & data rates may apply. Reply STOP to cancel at any time, reply HELP for help. Consent is not a condition of purchase. View our <a href="/terms" target="_blank">Terms of Service</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.
            </label>
        </div>

        <button type="button">Save Preferences</button>
    </form>
</body>
</html>
